function ficha(pk){var c=car(pk),u=consulta(pk),ms=multaStats(pk),g=temGnv(pk),a=ajuste(pk),rt=reteste(pk),last=(IMP.consultas&&IMP.consultas[pk]&&IMP.consultas[pk].ultimaConsulta)||'';var h='<h2>'+esc(c.nome)+'</h2><div class="sub">'+esc(fmtPlaca(c.placa))+' · '+(c.inGestao?'vinculado ao Gestão':'registro fiscal legado')+'</div><div class="sect">Consulta rápida</div><div class="quick"><div class="qbox copy" onclick="copyVal(\''+esc(u.renavam||c.renavam||'')+'\',\'RENAVAM\')"><div><div class="qlabel">RENAVAM</div><div class="qval">'+esc(u.renavam||c.renavam||'Não cadastrado')+'</div></div><span class="copyic">COPIAR</span></div><div class="qbox copy" onclick="copyVal(\''+esc(u.doc||'')+'\',\''+esc(u.docTipo||'Documento')+'\')"><div><div class="qlabel">'+esc(u.docTipo||'CPF / CNPJ')+'</div><div class="qval">'+esc(u.doc||'Não cadastrado')+'</div></div><span class="copyic">COPIAR</span></div></div><div class="split" style="margin-top:8px"><button class="btn sec" onclick="abrirDetran()">Abrir DETRAN-RJ</button><button class="btn sec" onclick="registrarConsulta(\''+pk+'\')">✓ Consultei agora</button></div><div class="sub" style="margin-top:6px">'+(last?'Última consulta registrada: '+dataBR(last):'Nenhuma consulta registrada pelo app. Isso não vira tarefa nem alerta.')+'</div><div class="sect">Situação</div><div class="tags">'+tagGrupo(pk)+'<span class="tag '+(g===true?'ok':'')+'">GNV: '+(g===true?'sim':g===false?'não':'não definido')+'</span><span class="tag">CRLV Gestão: '+esc(c.exercicioCRLV||'—')+'</span>'+(g===true&&rt?'<span class="tag warn">Reteste: '+dataBR(rt)+'</span>':'')+'</div><button class="btn sec" style="width:100%;margin-top:9px" onclick="editarVeiculoFiscal(\''+pk+'\')">Editar frota / GNV / dados de consulta</button><div class="sect">Multas</div><div class="exrows"><div class="exrow"><span>Registros ativos</span><b>'+ms.ativas+'</b></div><div class="exrow"><span>Valor conhecido</span><b>'+brl(ms.valor)+'</b></div><div class="exrow"><span>Sem valor</span><b>'+ms.semValor+'</b></div></div><div class="split" style="margin-top:8px"><button class="btn sec" onclick="novaMulta(\''+pk+'\')">+ Adicionar multa</button><button class="btn" onclick="multasCarro(\''+pk+'\')">Ver multas</button></div><div class="sect">Exercícios</div><div class="split"><button class="btn sec" onclick="ANO_EXERC=\'2026\';abrirExercicio(\''+pk+'\')">2026</button><button class="btn sec" onclick="ANO_EXERC=\'2027\';abrirExercicio(\''+pk+'\')">2027</button></div>';openSheet(h)}
function abrirDetran(){var u=((IMP&&IMP.config)||{}).detranUrl||'https://www.detran.rj.gov.br/';window.open(u,'_blank','noopener')}
function registrarConsulta(pk){pushPath('consultas/'+pk+'/ultimaConsulta',agora(),'✅ Consulta registrada');ficha(pk)}
function editarVeiculoFiscal(pk){var c=car(pk),u=consulta(pk),a=ajuste(pk),g=temGnv(pk);var gs=a.grupoOverride||'';var gv=typeof a.temGnvOverride==='boolean'?(a.temGnvOverride?'sim':'nao'):'gestao';var h='<h2>Dados fiscais</h2><div class="sub">'+esc(c.nome)+' · '+esc(fmtPlaca(c.placa))+'</div><div class="formgrid"><div><label>Frota</label><select id="ef_grupo"><option value="" '+(!gs?'selected':'')+'>Usar Gestão</option><option value="fabio" '+(gs==='fabio'?'selected':'')+'>Frota Fábio</option><option value="hudson" '+(gs==='hudson'?'selected':'')+'>Frota Hudson</option><option value="legado" '+(gs==='legado'?'selected':'')+'>Legado / fora da frota</option></select></div><div><label>GNV</label><select id="ef_gnv"><option value="gestao" '+(gv==='gestao'?'selected':'')+'>Usar Gestão ('+(g===true?'sim':g===false?'não':'não definido')+')</option><option value="sim" '+(gv==='sim'?'selected':'')+'>Com GNV</option><option value="nao" '+(gv==='nao'?'selected':'')+'>Sem GNV</option></select></div><div><label>Reteste / requalificação</label><input type="date" id="ef_rt" value="'+esc(a.retesteOverride||'')+'"></div><div><label>RENAVAM para consulta</label><input id="ef_ren" inputmode="numeric" value="'+esc(u.renavam||c.renavam||'')+'"></div><div><label>Tipo documento</label><select id="ef_dt"><option '+(u.docTipo==='CPF'?'selected':'')+'>CPF</option><option '+(u.docTipo==='CNPJ'?'selected':'')+'>CNPJ</option></select></div><div><label>CPF / CNPJ para consulta</label><input id="ef_doc" value="'+esc(u.doc||'')+'"></div></div><div class="notice" style="margin-top:9px">“Usar Gestão” mantém o vínculo de leitura. Se você escolher Com/Sem GNV aqui, o Imposto usa esse ajuste sem alterar o Gestão.</div><button class="btn" style="width:100%;margin-top:10px" onclick="salvarVeiculoFiscal(\''+pk+'\')">Salvar</button>';openSheet(h)}
function salvarVeiculoFiscal(pk){var gv=document.getElementById('ef_gnv').value,gr=document.getElementById('ef_grupo').value,rt=document.getElementById('ef_rt').value,p={};p['ajustesVeiculos/'+pk+'/grupoOverride']=gr||null;p['ajustesVeiculos/'+pk+'/retesteOverride']=rt||null;p['ajustesVeiculos/'+pk+'/temGnvOverride']=gv==='gestao'?null:gv==='sim';p['consulta/'+pk+'/renavam']=document.getElementById('ef_ren').value.trim();p['consulta/'+pk+'/docTipo']=document.getElementById('ef_dt').value;p['consulta/'+pk+'/doc']=document.getElementById('ef_doc').value.trim();pushPatch(p,'✅ Dados fiscais atualizados');closeSheet()}
function seletorCarroNovaMulta(){var opts=allCarKeys().map(function(pk){var c=car(pk);return'<option value="'+pk+'">'+esc(c.nome)+' · '+esc(fmtPlaca(c.placa))+'</option>'}).join('');openSheet('<h2>Nova multa</h2><div class="sub">Escolha o veículo.</div><label class="sub">Veículo</label><select id="nmcar">'+opts+'</select><button class="btn" style="width:100%;margin-top:10px" onclick="var p=document.getElementById(\'nmcar\').value;novaMulta(p)">Continuar</button>')}
function novaMulta(pk,id){var old=id?getPath(IMP,'multas/'+pk+'/'+id):null,m=old||{};var h='<h2>'+(id?'Editar multa':'Adicionar multa')+'</h2><div class="sub">'+esc(car(pk).nome)+' · '+esc(fmtPlaca(pk))+'</div><div class="formgrid"><div><label>Data da infração *</label><input type="date" id="mu_data" value="'+esc(m.dataInfracao||'')+'"></div><div><label>Valor da multa</label><input inputmode="decimal" id="mu_val" placeholder="0,00" value="'+(Number(m.valor)>0?String(Number(m.valor).toFixed(2)).replace('.',','):'')+'"></div></div><button class="btn" style="width:100%;margin-top:10px" onclick="salvarMulta(\''+pk+'\',\''+(id||'')+'\')">Salvar multa</button>'+(id?'<button class="btn red" style="width:100%;margin-top:7px" onclick="excluirMulta(\''+pk+'\',\''+id+'\')">Excluir multa</button>':'');openSheet(h)}
function salvarMulta(pk,id){var d=document.getElementById('mu_data').value;if(!d)return toast('Informe a data da infração');var old=id?getPath(IMP,'multas/'+pk+'/'+id):null,mid=id||idNovo('m');var m=Object.assign({},old||{id:mid,cadastradaEm:agora(),origem:'Imposto'},{dataInfracao:d,valor:parseMoney(document.getElementById('mu_val').value),editadaEm:agora()});delete m.vencimento;delete m.descricao;delete m.status;delete m.pagaEm;delete m.valorPago;pushPath('multas/'+pk+'/'+mid,m);pushPath('consulta/'+pk+'/ultimaAtualizacaoLista',hoje(),'✅ Multa salva');multasCarro(pk)}
function excluirMulta(pk,id){ask('Excluir multa?','O registro será removido do Imposto.','Excluir',function(){pushPath('multas/'+pk+'/'+id,null,'🗑 Multa removida');multasCarro(pk)})}
function multasCarro(pk){var c=car(pk),a=multasArr(pk),s=multaStats(pk);var h='<h2>Multas</h2><div class="sub">'+esc(c.nome)+' · '+esc(fmtPlaca(c.placa))+'</div><div class="metrics" style="margin-top:10px"><div class="metric"><span>Quantidade</span><strong>'+s.ativas+'</strong></div><div class="metric"><span>Valor total conhecido</span><strong class="money">'+brl(s.valor)+'</strong></div></div><button class="btn" style="width:100%" onclick="novaMulta(\''+pk+'\')">+ Adicionar multa</button><div class="sect">Multas cadastradas</div>';if(!a.length)h+='<div class="empty">Nenhuma multa cadastrada.</div>';a.forEach(function(m){var v=Number(m.valor)||0;h+='<div class="cat"><div class="cathead"><div class="grow"><div class="catname">Infração em '+dataBR(m.dataInfracao)+'</div><div class="catval">'+(v?brl(v):'<span class="muted">valor não informado</span>')+'</div></div><button class="btn sm sec" onclick="novaMulta(\''+pk+'\',\''+esc(m.id)+'\')">Editar</button></div></div>'});openSheet(h)}
function catCard(pk,e,k){if(k==='gnv'&&temGnv(pk)!==true)return'';var x=e[k]||{},p=(e.pagamentos||{})[k]||{},v=Number(x.valor)||0,imp=!!e.importadoPlanilha;return'<div class="cat"><div class="cathead"><div class="grow"><div class="catname">'+CATN[k]+'</div><div class="catval">'+brl(v)+'</div><div class="sub">'+(x.vencimento?'Vence '+dataBR(x.vencimento):'Sem vencimento')+(p.pago?' · pago '+dataBR(p.data):'')+'</div></div><span class="tag '+(p.pago?'ok':v?'warn':'')+'">'+(imp?'Histórico':p.pago?'Pago':v?'Lançado':'Zerado')+'</span></div>'+(imp?'<div class="sub" style="margin-top:7px">Pagamento por categoria não existia na planilha de 2026; o total pago histórico é preservado separadamente.</div>':v?(p.pago?'<button class="btn sm sec" onclick="desfazerPagamento(\''+pk+'\',\''+k+'\')">Desfazer pagamento</button>':'<button class="btn sm ok" onclick="pagarCategoria(\''+pk+'\',\''+k+'\')">Paguei hoje</button>'):'')+'</div>'}
function historicoHtml(pk,ano){var a=historicoArr(pk,ano).slice(0,12);if(!a.length)return'<div class="empty">Nenhuma ação registrada neste exercício.</div>';return'<div class="card">'+a.map(function(e){var cat=e.categoria?(' · '+(CATN[e.categoria]||e.categoria)):'';var val=Number(e.valor)>0?(' · '+brl(e.valor)):'';var nomes={pagamento:'Pagamento registrado',estorno:'Pagamento desfeito',documento_na_mao:'Documento marcado na mão',documento_desfeito:'Documento desfeito'};return'<div class="listrow"><div class="grow"><b>'+esc(nomes[e.acao]||e.acao)+esc(cat)+esc(val)+'</b><div class="sub">'+dataHoraBR(e.em||e.data)+'</div></div></div>'}).join('')+'</div>'}
function abrirExercicio(pk){var c=car(pk),e=ex(pk,ANO_EXERC),t=exTotal(e),p=exPago(e),f=exFalta(e),doc=e.documentoStatus==='na_mao';var h='<h2>'+ANO_EXERC+' · '+esc(c.nome)+'</h2><div class="sub">'+esc(fmtPlaca(c.placa))+' · '+(e.importadoPlanilha?'histórico importado da planilha':'lançamento do aplicativo')+'</div><div class="metrics" style="margin-top:10px"><div class="metric"><span>Total</span><strong class="money">'+brl(t)+'</strong></div><div class="metric"><span>Falta</span><strong class="money">'+brl(f)+'</strong></div></div><div class="sect">Valores</div>'+CATS.map(function(k){return catCard(pk,e,k)}).join('')+'<button class="btn sec" style="width:100%" onclick="editarExercicio(\''+pk+'\')">Editar valores e vencimentos</button><div class="sect">Documento</div><div class="cat"><div class="cathead"><div class="grow"><div class="catname">CRLV / Documento '+ANO_EXERC+'</div><div class="catval">'+(doc?'NA MÃO':'PENDENTE')+'</div><div class="sub">'+(e.documentoData?'Marcado em '+dataBR(e.documentoData):e.statusImportado?esc(e.statusImportado):'Controle manual do exercício')+'</div></div><span class="tag '+(doc?'ok':'warn')+'">'+(doc?'OK':'Pendente')+'</span></div><button class="btn '+(doc?'sec':'ok')+'" onclick="toggleDocumento(\''+pk+'\')">'+(doc?'Desfazer “na mão”':'Documento '+ANO_EXERC+' na mão')+'</button></div><div class="sect">Histórico de ações</div>'+historicoHtml(pk,ANO_EXERC);openSheet(h)}
function editarExercicio(pk){var e=clone(ex(pk,ANO_EXERC));function f(k,p){return e[k]&&e[k][p]?e[k][p]:''}var h='<h2>Editar '+ANO_EXERC+'</h2><div class="sub">'+esc(car(pk).nome)+' · os campos vazios ficam zerados.</div><div class="formgrid">';CATS.forEach(function(k){if(k==='gnv'&&temGnv(pk)!==true)return;h+='<div><label>'+CATN[k]+' · valor</label><input inputmode="decimal" id="ex_'+k+'_v" value="'+(catVal(e,k)?String(catVal(e,k).toFixed(2)).replace('.',','):'')+'"></div><div><label>'+CATN[k]+' · vencimento</label><input type="date" id="ex_'+k+'_d" value="'+esc(f(k,'vencimento'))+'"></div>'});if(e.importadoPlanilha)h+='<div><label>Total já pago · histórico 2026</label><input inputmode="decimal" id="ex_pago_hist" value="'+String((Number(e.totalPagoImportado)||0).toFixed(2)).replace('.',',')+'"></div>';h+='</div><div class="notice" style="margin-top:9px">Salvar valores não marca nada como pago. Em exercícios novos, o pagamento só acontece quando você toca em “Paguei hoje”. No histórico importado de 2026, o total já pago é mantido como um único valor porque a planilha antiga não separava a data de cada pagamento.</div><button class="btn" style="width:100%;margin-top:10px" onclick="salvarExercicio(\''+pk+'\')">Salvar valores</button>';openSheet(h)}
function salvarExercicio(pk){var e=clone(ex(pk,ANO_EXERC)),p={};CATS.forEach(function(k){var a=document.getElementById('ex_'+k+'_v'),b=document.getElementById('ex_'+k+'_d');if(!a)return;p['exercicios/'+ANO_EXERC+'/'+pk+'/'+k]={valor:parseMoney(a.value),vencimento:b?b.value:''}});p['exercicios/'+ANO_EXERC+'/'+pk+'/editadoEm']=agora();if(e.importadoPlanilha){var total=0;CATS.forEach(function(k){var a=document.getElementById('ex_'+k+'_v');if(a)total+=parseMoney(a.value);else total+=catVal(e,k)});p['exercicios/'+ANO_EXERC+'/'+pk+'/totalDocumento']=Math.round(total*100)/100;var ph=document.getElementById('ex_pago_hist'),pag=ph?parseMoney(ph.value):(Number(e.totalPagoImportado)||0);p['exercicios/'+ANO_EXERC+'/'+pk+'/totalPagoImportado']=pag;p['exercicios/'+ANO_EXERC+'/'+pk+'/faltaPagarImportado']=Math.max(0,Math.round((total-pag)*100)/100)}pushPatch(p,'✅ Exercício atualizado');abrirExercicio(pk)}
function pagarCategoria(pk,k){var e=clone(ex(pk,ANO_EXERC)),v=catVal(e,k);if(!(v>0))return toast('Informe o valor antes');ask('Marcar '+CATN[k]+' como pago?',brl(v)+' · pagamento em '+dataBR(hoje()),'Paguei',function(){var ev=novoEvento(pk,'exercicio','pagamento',{categoria:k,valor:v,ano:ANO_EXERC}),p=eventoPatch(pk,ev);p['exercicios/'+ANO_EXERC+'/'+pk+'/pagamentos/'+k]={pago:true,data:hoje(),valor:v,registradoEm:agora()};pushPatch(p,'✅ Pagamento registrado');abrirExercicio(pk)})}
function desfazerPagamento(pk,k){var e=clone(ex(pk,ANO_EXERC)),q=(e.pagamentos||{})[k]||{},v=Number(q.valor)||catVal(e,k);ask('Desfazer pagamento?','O valor lançado continua e o estorno fica registrado no histórico.','Desfazer',function(){var ev=novoEvento(pk,'exercicio','estorno',{categoria:k,valor:v,ano:ANO_EXERC}),p=eventoPatch(pk,ev);p['exercicios/'+ANO_EXERC+'/'+pk+'/pagamentos/'+k]=null;pushPatch(p,'✅ Pagamento desfeito');abrirExercicio(pk)})}
function toggleDocumento(pk){var e=clone(ex(pk,ANO_EXERC)),on=e.documentoStatus==='na_mao';if(on){ask('Desfazer documento na mão?','O exercício volta para documento pendente e a alteração fica no histórico.','Desfazer',function(){var ev=novoEvento(pk,'exercicio','documento_desfeito',{ano:ANO_EXERC}),p=eventoPatch(pk,ev);p['exercicios/'+ANO_EXERC+'/'+pk+'/documentoStatus']='pendente';p['exercicios/'+ANO_EXERC+'/'+pk+'/documentoData']=null;pushPatch(p,'✅ Documento atualizado');abrirExercicio(pk)})}else{ask('Documento '+ANO_EXERC+' na mão?','Vou registrar automaticamente a data de hoje: '+dataBR(hoje()),'Confirmar',function(){var ev=novoEvento(pk,'exercicio','documento_na_mao',{ano:ANO_EXERC}),p=eventoPatch(pk,ev);p['exercicios/'+ANO_EXERC+'/'+pk+'/documentoStatus']='na_mao';p['exercicios/'+ANO_EXERC+'/'+pk+'/documentoData']=hoje();pushPatch(p,'✅ Documento registrado');abrirExercicio(pk)})}}
function salvarDetran(){var u=document.getElementById('detUrl').value.trim();if(!u)return;pushPath('config/detranUrl',u,'✅ Endereço salvo')}function trocarChave(){ask('Trocar chave da família?','Você será desconectado deste banco. Os dados locais não serão apagados, mas outra chave usa outro banco.','Trocar chave',function(){localStorage.removeItem('gestao_famkey');localStorage.removeItem('imposto_famkey');location.reload()})}
/* Auto-update seguro: nunca recarrega com formulário/sheet aberto. */
function podeRecarregar(){var ov=document.getElementById('ov'),ask=document.getElementById('askOv'),a=document.activeElement;var digitando=a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));return !(ov&&ov.classList.contains('open'))&&!(ask&&ask.classList.contains('open'))&&!digitando}
function aplicarAtualizacao(v){if(!v||v<=APP_VER)return;if(!podeRecarregar()){PENDING_UPDATE_VER=Math.max(PENDING_UPDATE_VER,v);toast('⬆️ Nova versão pronta; atualizo quando você fechar esta tela');return}toast('⬆️ Atualizando para v'+v+'…');setTimeout(function(){if(!podeRecarregar()){PENDING_UPDATE_VER=Math.max(PENDING_UPDATE_VER,v);return}var u=new URL(location.href);u.searchParams.set('v',v);u.searchParams.set('_upd',Date.now());location.replace(u.href)},700)}
function tentarAtualizacaoPendente(){if(PENDING_UPDATE_VER&&podeRecarregar()){var v=PENDING_UPDATE_VER;PENDING_UPDATE_VER=0;aplicarAtualizacao(v)}}
function checkUpdate(){fetch('index.html?upd='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){var m=t.match(/APP_VER=(\d+)/),v=m?parseInt(m[1],10):0;if(v>APP_VER)aplicarAtualizacao(v)}).catch(function(){})}
if('serviceWorker'in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./SW.js').catch(function(){})})}setTimeout(checkUpdate,4500);setInterval(checkUpdate,15*60*1000);window.addEventListener('focus',function(){checkUpdate();tentarAtualizacaoPendente()});
boot();
</script>
